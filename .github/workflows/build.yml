# The release packages (README "Downloads"): the launcher and the player, which plays the game folder
# ACNHRecomp-Importer prepared, with the libraries they need; nothing of the game. One per system, each built on the
# oldest one it should run on. Run from the Actions tab (Build > Run workflow); each package is an artifact of the run.
name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in the package names (empty: the commit's short hash)"
        required: false
        default: ""

permissions:
  contents: read

env:
  SDL3: "3.4.16"          # as tools/setup_acnh.py
  VK_HEADERS: "1.4.357"   # as tools/setup_acnh.py

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v=${INPUT:-${GITHUB_SHA::7}}
          [[ $v =~ ^[A-Za-z0-9._-]+$ ]] || { echo "version: letters, digits and . _ - only"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the launcher's version (git describe)
      - uses: ilammy/msvc-dev-cmd@v1  # vcvars64: clang-cl links against the Windows SDK and the C runtime
        with:
          arch: x64
      - name: SDL3, Vulkan headers
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          curl -fsSL -o "$T/sdl.zip" "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-devel-$SDL3-VC.zip"
          7z x -bso0 -o"$RUNNER_TEMP" "$RUNNER_TEMP/sdl.zip"
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" | tar -xz -C "$T"
      - name: libvpx, libvorbis (vcpkg)
        run: |
          "$(cygpath -u "$VCPKG_INSTALLATION_ROOT")/vcpkg.exe" install libvpx:x64-windows-static-md-release \
              libvorbis:x64-windows-static-md-release --disable-metrics
      - name: Package
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          T=$(cygpath -m "$RUNNER_TEMP")
          tools/package_release_win.sh "$VERSION" "$T/SDL3-$SDL3" \
              "$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows-static-md-release" \
              "$T/Vulkan-Headers-$VK_HEADERS/include"
      - uses: actions/upload-artifact@v7
        with:
          path: private/release/ACNHRecomp-${{ env.VERSION }}-windows-x64.zip
          archive: false
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: version
    runs-on: macos-14  # Homebrew's libraries there run on macOS 14 and newer
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: brew install ninja sdl3 molten-vk vulkan-loader vulkan-headers libvpx libvorbis
      - name: Package
        run: tools/package_release_mac.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          path: private/release/ACNHRecomp-${{ env.VERSION }}-macOS-arm64.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-22.04  # glibc 2.35: what the package runs on, and newer
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tools
        run: |
          sudo apt-get update
          # clang 18 (apt.llvm.org); SDL3's build dependencies (SDL's docs/README-linux.md): it loads these libraries
          # at run time when present; the game's: Vulkan, libvpx, libvorbis.
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s 18
          sudo apt-get install -y --no-install-recommends ninja-build patchelf pkg-config \
               libvulkan-dev libvpx-dev libvorbis-dev \
               libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
               libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev \
               libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev libwayland-dev \
               wayland-protocols libdecor-0-dev
      - name: SDL3, Vulkan headers
        run: |
          # Ubuntu 22.04's Vulkan headers (1.3.204) are older than the runtime's
          curl -fsSL "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v$VK_HEADERS.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-$SDL3/SDL3-$SDL3.tar.gz" |
            tar -xz -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL3-$SDL3" -B "$RUNNER_TEMP/sdl3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3"
          cmake --build "$RUNNER_TEMP/sdl3-build"
          cmake --install "$RUNNER_TEMP/sdl3-build"
      - name: Package
        env:
          CC: clang-18
          CXX: clang++-18
        run: tools/package_release_linux.sh "$VERSION" "$RUNNER_TEMP/sdl3" "$RUNNER_TEMP/Vulkan-Headers-$VK_HEADERS/include"
      - uses: actions/upload-artifact@v7
        with:
          path: private/release/ACNHRecomp-${{ env.VERSION }}-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
